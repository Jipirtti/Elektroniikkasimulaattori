  Suunnittelu, sisältö ja validointi: Juho Pirttilahti. Ohjelmakoodi toteutettu tekoälyavusteisesti (Claude, Anthropic).
  Lisenssi: Creative Commons Nimeä 4.0 Kansainvälinen (CC BY 4.0), https://creativecommons.org/licenses/by/4.0/deed.fi
  Saat kopioida, jakaa ja muokata ohjelmaa mihin tahansa tarkoitukseen, kunhan mainitset
  tekijän ja oppilaitoksen, merkitset lisenssin ja kerrot tekemistäsi muutoksista.
-->
<html lang="fi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elektroniikkasimulaattori</title>
<meta name="author" content="Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK)">
<meta name="copyright" content="Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026. CC BY 4.0">
<link rel="license" href="https://creativecommons.org/licenses/by/4.0/deed.fi">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600&family=Barlow+Condensed:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#DCE3E9; --paper:#F7F9FA; --grid:#E2E8ED; --grid2:#D3DBE2; --panel:#EDF1F4; --ink:#17212B; --muted:#56636F;
  --line:#C2CBD3; --acc:#E39B17; --sel:#1E5DBA; --ok:#2E8B57; --warn:#C0392B; --on:#E39B17;
  --scr:#0D1418; --scrgrid:#2A3A40; --scrtxt:#9FB3BA;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1419; --paper:#131A20; --grid:#1A232B; --grid2:#222D36; --panel:#161F26; --ink:#E2E8EE; --muted:#93A0AC;
    --line:#2A3540; --acc:#F0A82A; --sel:#6FA7FF; --ok:#4CC38A; --warn:#FF6B5B; --on:#F0A82A;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1419; --paper:#131A20; --grid:#1A232B; --grid2:#222D36; --panel:#161F26; --ink:#E2E8EE; --muted:#93A0AC;
  --line:#2A3540; --acc:#F0A82A; --sel:#6FA7FF; --ok:#4CC38A; --warn:#FF6B5B; --on:#F0A82A;
}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);
  font-family:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%}
button,select,input{font:inherit;color:inherit}
button:focus-visible,select:focus-visible,input:focus-visible{outline:3px solid var(--sel);outline-offset:1px}

.app{height:100%;display:grid;grid-template-columns:222px minmax(0,1fr) 316px;grid-template-rows:auto minmax(0,1fr) 290px;
  grid-template-areas:"bar bar bar" "pal stage insp" "pal scope insp"}
.bar{grid-area:bar;display:flex;flex-wrap:wrap;align-items:center;gap:8px 18px;padding:8px 14px;border-bottom:1px solid var(--line);background:var(--panel)}
.brand{display:flex;flex-direction:column;line-height:1.1;margin-right:6px}
.brand strong{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:24px;font-weight:600}
.brand span{font-size:13px;color:var(--muted)}
.grp{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.langsw{display:inline-flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.langsw button{border:0;background:var(--paper);padding:5px 12px;cursor:pointer;font-size:14px;font-weight:600}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.mnote{font-size:13px;color:var(--muted);margin:6px 0 2px}
.btn{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 12px;cursor:pointer;min-height:34px}
.btn:hover{border-color:var(--muted)}
a.btn{display:inline-flex;align-items:center;text-decoration:none;color:var(--ink)}
.btn.pri{background:var(--ink);color:var(--paper);border-color:var(--ink);min-width:118px}
.btn.on{background:var(--acc);border-color:var(--acc);color:#1E1404}
.btn.danger{color:var(--warn)}
select{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:6px 8px;min-height:34px}
.mini{display:flex;align-items:center;gap:6px;font-size:14px;color:var(--muted)}
.time{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:20px;font-variant-numeric:tabular-nums;min-width:130px}

.pal{grid-area:pal;overflow:auto;border-right:1px solid var(--line);background:var(--panel);padding:8px 8px 20px}
.pal h3{font-size:13px;font-weight:600;color:var(--muted);margin:12px 4px 6px}
.pal h3:first-child{margin-top:2px}
.copy a,.mcopy a{color:inherit}
.copy{font-size:11.5px;line-height:1.35;color:var(--muted);margin:14px 4px 0;padding-top:10px;border-top:1px solid var(--line)}
.mcopy{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:10px;margin-top:14px}
.pitem{display:flex;align-items:center;gap:8px;width:100%;text-align:left;background:var(--paper);border:1px solid var(--line);
  border-radius:8px;padding:4px 8px 4px 4px;margin:0 0 5px;cursor:grab;touch-action:none;user-select:none;font-size:14px;line-height:1.15}
.pitem:hover{border-color:var(--acc)}
.pitem svg{width:46px;height:34px;flex:none;color:var(--ink)}
.ghost{position:fixed;pointer-events:none;z-index:50;background:var(--paper);border:1px solid var(--acc);border-radius:8px;padding:4px 10px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.18)}

.stage{grid-area:stage;position:relative;overflow:hidden;background:var(--paper)}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;color:var(--ink);user-select:none;-webkit-user-select:none}
.tools{position:absolute;left:10px;top:10px;z-index:5;display:flex;flex-wrap:wrap;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:4px;max-width:calc(100% - 20px)}
.tools button{border:0;background:transparent;border-radius:7px;padding:5px 10px;cursor:pointer;font-size:14px;display:flex;align-items:center;gap:6px}
.tools button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.tools .sw{width:10px;height:10px;border-radius:50%;display:inline-block}
.tools label{display:flex;align-items:center;gap:5px;font-size:14px;padding:0 8px;color:var(--muted)}
.status{position:absolute;left:10px;right:10px;bottom:8px;z-index:5;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:flex-end;pointer-events:none}
.legendp{pointer-events:auto;display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
.legendp .grad{width:120px;height:9px;border-radius:5px;background:linear-gradient(90deg,#2E6FD0,#7A8794 50%,#D23B2E)}
.legendp select{min-height:26px;padding:1px 4px;font-size:13px}
.warns{pointer-events:auto;font-size:13px;display:flex;flex-direction:column;gap:3px;max-width:560px}
.warns div{background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--warn);border-radius:6px;padding:3px 8px}
.warns div.info{border-left-color:var(--sel)}
.tip{position:absolute;z-index:20;pointer-events:none;background:var(--ink);color:var(--paper);font-size:13px;padding:4px 8px;border-radius:6px;white-space:nowrap;display:none;font-variant-numeric:tabular-nums}

.insp{grid-area:insp;overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:12px 14px 30px}
.insp h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;margin:0 0 2px}
.insp h3{font-size:14px;font-weight:600;margin:16px 0 6px;padding-top:10px;border-top:1px solid var(--line)}
.insp p{margin:0 0 8px;color:var(--muted)}
.ih{display:flex;align-items:center;gap:8px;margin-bottom:2px}
.ih input{width:86px;font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:22px;font-weight:600;background:transparent;border:1px solid transparent;border-radius:6px;padding:0 4px}
.ih input:hover,.ih input:focus{border-color:var(--line);background:var(--paper)}
.tn{color:var(--muted);font-size:14px}
.fld{display:grid;grid-template-columns:1fr 128px;gap:8px;align-items:center;margin:0 0 6px;font-size:14px}
.fld .inp{display:flex;align-items:center;gap:4px}
.fld input,.fld select{width:100%;background:var(--paper);border:1px solid var(--line);border-radius:6px;padding:4px 6px;min-height:30px;font-variant-numeric:tabular-nums}
.fld em{font-style:normal;color:var(--muted);font-size:12.5px;min-width:34px}
.der{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:0;font-size:14px}
.der dt{color:var(--muted)}
.der dd{margin:0;text-align:right;font-variant-numeric:tabular-nums;font-weight:500}
.der .bad{color:var(--warn);font-weight:600}
.ctl{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:10px 0}
.help .res{background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 10px;margin:6px 0;font-size:14px;font-variant-numeric:tabular-nums}
.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.kbd{font-size:12.5px;color:var(--muted)}

/* oskilloskooppi */
.scope{grid-area:scope;border-top:1px solid var(--line);background:var(--panel);display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:10px;padding:8px 12px;min-height:0}
.scr{position:relative;min-height:0;display:flex;flex-direction:column;gap:4px}
.scr canvas{flex:1;min-height:0;width:100%;display:block;background:var(--scr);border-radius:8px;border:1px solid var(--line)}
.meas{font-size:12.5px;font-variant-numeric:tabular-nums;border-collapse:collapse;width:100%}
.meas th,.meas td{padding:1px 6px;text-align:right;white-space:nowrap}
.meas th:first-child,.meas td:first-child{text-align:left}
.meas th{color:var(--muted);font-weight:500}
.sctl{overflow:auto;font-size:13px;display:flex;flex-direction:column;gap:6px;min-height:0}
.sctl .row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.sctl select,.sctl input{min-height:28px;padding:2px 5px;font-size:13px;border-radius:6px}
.sctl input[type=number]{width:72px;background:var(--paper);border:1px solid var(--line)}
.sctl .lbl{color:var(--muted)}
.ch{display:grid;grid-template-columns:34px minmax(0,1fr) 82px 70px 26px;gap:5px;align-items:center}
.ch b{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:16px}
.ch .tg{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ch button{border:1px solid var(--line);background:var(--paper);border-radius:6px;cursor:pointer;height:26px}
.empty{color:var(--muted);font-size:13px;margin:2px 0}
.edge{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.edge button{border:0;background:var(--paper);padding:2px 9px;cursor:pointer}
.edge button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

.modal{position:fixed;inset:0;background:rgba(10,15,20,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.open{display:flex}
.mbox{background:var(--panel);border:1px solid var(--line);border-radius:12px;max-width:720px;width:100%;max-height:88vh;overflow:auto;padding:18px 20px}
.mbox h2{font-family:"Barlow Condensed","Arial Narrow",sans-serif;font-size:26px;margin:0 0 8px}
.mbox h3{font-size:15px;margin:14px 0 4px}
.mbox p{margin:0 0 8px;max-width:70ch}
.mbox textarea{width:100%;height:220px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:8px}
.mrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;justify-content:flex-end}

/* SVG */
.sy{fill:none;stroke:currentColor;stroke-width:1.8;stroke-linejoin:round;stroke-linecap:round}
.syf{fill:var(--paper);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.fi{fill:currentColor}
.dash{stroke-dasharray:4 3}
.cond{fill:var(--on);stroke:currentColor;stroke-width:1.8;stroke-linejoin:round}
.hot{stroke:var(--on);stroke-width:3}
.sym{fill:currentColor;font:600 14px "Barlow",system-ui,sans-serif}
.syms{fill:currentColor;font:600 11px "Barlow",system-ui,sans-serif}
.hit{fill:transparent;stroke:none}
.comp{cursor:move}
.wh{fill:none;stroke:transparent;stroke-width:12;cursor:pointer}
.wb{fill:none;stroke-width:3;stroke-linejoin:round;stroke-linecap:round}
.wf{fill:none;stroke:rgba(255,255,255,.95);stroke-width:1.6;stroke-dasharray:3 11;stroke-linecap:round}
.wire.selw .wb{stroke-width:5}
.wire.selw .wh{cursor:move}
.boxsel{fill:rgba(30,93,186,.08);stroke:#1E5DBA;stroke-width:1.2;stroke-dasharray:5 4}
.selr{fill:none;stroke:var(--sel);stroke-width:1.5;stroke-dasharray:5 4}
.port{fill:var(--paper);stroke:currentColor;stroke-width:1.5;cursor:crosshair}
.port.con{fill:currentColor}
.port:hover{stroke:var(--sel);stroke-width:3}
.pt{fill:var(--muted);font:500 10px "Barlow",system-ui,sans-serif;pointer-events:none}
.lt{fill:currentColor;font:600 12.5px "Barlow",system-ui,sans-serif;pointer-events:none}
.rt{fill:var(--muted);font:500 12px "Barlow",system-ui,sans-serif;pointer-events:none;font-variant-numeric:tabular-nums}
.probe{cursor:grab}
.probe rect{fill:var(--paper);stroke-width:1.8}
.probe text{font:600 12.5px "Barlow",system-ui,sans-serif;fill:currentColor;font-variant-numeric:tabular-nums}
.probe line{stroke-width:1.3;stroke-dasharray:3 2}
#tmpWire{fill:none;stroke:var(--sel);stroke-width:2;stroke-dasharray:5 4;pointer-events:none}

@media (max-width:900px){
  .app{height:auto;grid-template-columns:1fr;grid-template-rows:auto auto 62vh auto auto;
    grid-template-areas:"bar" "pal" "stage" "scope" "insp"}
  .pal{display:flex;gap:6px;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:6px}
  .pal h3,.pal .copy{display:none}
  .pitem{width:auto;flex:none;margin:0;touch-action:pan-x}
  .insp{border-left:0;border-top:1px solid var(--line)}
  .scope{grid-template-columns:1fr}
  .scr canvas{height:240px;flex:none}
}
@media (prefers-reduced-motion:reduce){.wf{stroke-dasharray:none;opacity:.35}}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div class="brand"><strong data-en="Electronics Simulator" data-de="Elektronik-Simulator">Elektroniikkasimulaattori</strong><span>Juho Pirttilahti, SEAMK 2026, CC BY 4.0</span></div>
    <div class="langsw" role="group" aria-label="Kieli / Language"><button type="button" data-lang="fi" lang="fi">FI</button><button type="button" data-lang="en" lang="en">EN</button><button type="button" data-lang="de" lang="de">DE</button></div>
    <div class="langsw" role="group" aria-label="Simulointimalli" data-en-aria="Simulation model" data-de-aria="Simulationsmodell"><button type="button" data-mode="simple" title="Ihanteelliset komponentit: ei kynnysjännitteitä, sisäisiä resistansseja eikä häviöitä" data-en-title="Ideal components: no threshold voltages, internal resistances or losses" data-de-title="Ideale Bauteile: keine Schleusenspannungen, Innenwiderstände oder Verluste" data-en="Simple" data-de="Einfach">Yksinkertainen</button><button type="button" data-mode="advanced" title="Todelliset komponentit: kynnysjännitteet, johtotilan resistanssit, lähteiden sisäinen impedanssi, kuollut aika" data-en-title="Real components: threshold voltages, on-state resistances, source impedance, dead time" data-de-title="Reale Bauteile: Schleusenspannungen, Durchlasswiderstände, Quellenimpedanz, Totzeit" data-en="Advanced" data-de="Erweitert">Kehittynyt</button></div>
    <div class="grp">
      <button class="btn pri" id="runBtn" type="button">Pysäytä</button>
      <button class="btn" id="resetBtn" type="button" title="Kondensaattorit ja kelat alkuarvoihin, aika nollaan" data-en-title="Capacitors and inductors to initial values, time to zero" data-de-title="Kondensatoren und Spulen auf Anfangswerte, Zeit auf null" data-en="Reset state" data-de="Zustand zurücksetzen">Nollaa tila</button>
      <label class="mini"><span data-en="Sim. speed" data-de="Sim.-Geschwindigkeit">Nopeus</span>
        <select id="speed">
          <option value="1" data-en="1 s/s (real time)" data-de="1 s/s (Echtzeit)">1 s/s (reaaliaika)</option>
          <option value="0.1">100 ms/s</option>
          <option value="0.02">20 ms/s</option>
          <option value="0.005">5 ms/s</option>
          <option value="0.001">1 ms/s</option>
        </select>
      </label>
      <span class="time" id="simTime">t = 0,000 s</span>
    </div>
    <div class="grp">
      <select id="exSel" aria-label="Esimerkkipiirit" data-en-aria="Example circuits" data-de-aria="Beispielschaltungen">
        <option value="" data-en="Example circuits…" data-de="Beispielschaltungen …">Esimerkkipiirit…</option>
        <option value="ex1" data-en="1. Voltage divider and RC charging" data-de="1. Spannungsteiler und Aufladung eines RC-Glieds">1. Jännitteenjako ja RC-lataus</option>
        <option value="ex2" data-en="2. Series RLC circuit (AC)" data-de="2. RLC-Reihenschwingkreis (AC)">2. RLC-sarjapiiri (AC)</option>
        <option value="ex3" data-en="3. Single-phase diode bridge + capacitor" data-de="3. Einphasige Diodenbrücke (B2) + Kondensator">3. Yksivaiheinen diodisilta + kondensaattori</option>
        <option value="ex4" data-en="4. Single-phase thyristor bridge, RL load" data-de="4. Einphasige Thyristorbrücke (B2C), RL-Last">4. Yksivaiheinen tyristorisilta, RL-kuorma</option>
        <option value="ex5" data-en="5. Three-phase diode bridge (B6)" data-de="5. Dreiphasige Diodenbrücke (B6)">5. Kolmivaiheinen diodisilta (B6)</option>
        <option value="ex6" data-en="6. Three-phase thyristor bridge (B6C)" data-de="6. Dreiphasige Thyristorbrücke (B6C)">6. Kolmivaiheinen tyristorisilta (B6C)</option>
        <option value="ex7" data-en="7. Buck converter" data-de="7. Tiefsetzsteller">7. Buck-hakkuri (alennus)</option>
        <option value="ex8" data-en="8. Boost converter" data-de="8. Hochsetzsteller">8. Boost-hakkuri (korotus)</option>
        <option value="ex9" data-en="9. Buck-boost converter" data-de="9. Inverswandler (Hoch-Tiefsetzsteller)">9. Buck-boost-hakkuri</option>
        <option value="ex10" data-en="10. H-bridge inverter, sine PWM" data-de="10. H-Brücken-Wechselrichter, Sinus-PWM">10. H-siltainvertteri, sini-PWM</option>
        <option value="ex11" data-en="11. Three-phase inverter, sine PWM" data-de="11. Dreiphasiger Wechselrichter, Sinus-PWM">11. Kolmivaiheinvertteri, sini-PWM</option>
        <option value="ex12" data-en="12. Transformer power supply" data-de="12. Netzteil mit Transformator">12. Muuntajateholähde</option>
        <option value="ex13" data-en="13. DC motor with a chopper" data-de="13. Gleichstrommotor mit Gleichstromsteller">13. DC-moottori ja katkoja</option>
      </select>
      <button class="btn" id="undoBtn" type="button" title="Ctrl+Z" data-en="Undo" data-de="Rückgängig">Kumoa</button>
      <button class="btn" id="ioBtn" type="button" data-en="Save / load" data-de="Speichern / Laden">Tallenna / lataa</button>
      <button class="btn" id="fitBtn" type="button" data-en="Fit view" data-de="Ansicht einpassen">Sovita näkymä</button>
      <button class="btn danger" id="clearBtn" type="button" data-en="Clear" data-de="Leeren">Tyhjennä</button>
      <button class="btn" id="helpBtn" type="button" data-en="Help" data-de="Hilfe">Ohje</button>
      <a class="btn" id="manualLink" href="https://jipirtti.github.io/Elektroniikkasimulaattori/docs/kayttoohje.html" target="_blank" rel="noopener" data-en="User manual" data-de="Bedienungsanleitung">Käyttöohje</a>
    </div>
  </header>

  <aside class="pal" id="pal" aria-label="Komponentit" data-en-aria="Components" data-de-aria="Bauteile"></aside>

  <main class="stage" id="stage">
    <div class="tools" role="toolbar" aria-label="Työkalut" data-en-aria="Tools" data-de-aria="Werkzeuge">
      <button type="button" data-tool="sel" aria-pressed="true" title="V"><span data-en="Select and connect" data-de="Auswählen und verbinden">Valitse ja kytke</span></button>
      <button type="button" data-tool="U" aria-pressed="false" title="Klikkaa komponenttia (jännite sen yli) tai johdinta (solmun jännite maata vasten)" data-en-title="Click a component (voltage across it) or a wire (node voltage to ground)" data-de-title="Bauteil anklicken (Spannung am Bauteil) oder Leitung (Knotenspannung gegen Masse)"><i class="sw" style="background:#D69A00"></i><span data-en="Voltage probe" data-de="Spannungstastkopf">Jänniteanturi</span></button>

const esc=s=>String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]));
/* luku SI-etuliitteellä: 0,0123 A → "12,3 mA" */
function si(x,u,dig=3){if(!Number.isFinite(x))return '–';const a=Math.abs(x);if(a===0)return '0 '+u;
  const P=[[1e6,'M'],[1e3,'k'],[1,''],[1e-3,'m'],[1e-6,'µ'],[1e-9,'n']];let k=P.find(p=>a>=p[0]*0.9995)||P[P.length-1];
  if(u==='V'&&k[0]===1e6)k=[1e3,'k'];
  const v=x/k[0],av=Math.abs(v),d=av>=100?Math.max(0,dig-3):av>=10?Math.max(0,dig-2):Math.max(0,dig-1);return nf(v,d)+' '+k[1]+u;}

/* ---------- symbolien apufunktiot ---------- */

  return L(x1,y1,bx,by,c)+`<polygon class="${fc}" points="${r1(x2)},${r1(y2)} ${r1(bx+px)},${r1(by+py)} ${r1(bx-px)},${r1(by-py)}"/>`;}

/* ---------- hilaohjaus (MOSFET, IGBT) ---------- */
function gateRaw(p,t){
  let g;
  if(p.g==='on')g=true;else if(p.g==='off')g=false;
  else if(p.g==='pwm'){const x=t*p.f*1000+p.ph/360;g=(x-Math.floor(x))<p.D/100-1e-12;}
  else{const m=p.ma*Math.sin(TWO_PI*p.fm*t+p.ph*Math.PI/180);const x=t*p.f*1000;const fr=x-Math.floor(x);const c=fr<0.5?4*fr-1:3-4*fr;g=m>c;}
  return p.inv==='kylla'?!g:g;}
function gate(c,t){const p=c.p;const g=gateRaw(p,t);if(!g||!(p.td>0)||p.g==='on'||p.g==='off')return g;return gateRaw(p,t-p.td*1e-6);}

const IDEAL={vdc:{Rs:0},vac:{Rs:0,Ls:0},v3:{Rs:0,Ls:0},c:{esr:0},l:{rl:0},tr:{ideal:1},sw:{Ron:0.001},d:{Vf:0,Ron:1},scr:{Vt0:0,Ron:1,Ih:0},

  mos:['g','f','D','fm','ma','ph','inv','bd'],igbt:['g','f','D','fm','ma','ph','inv','vd'],dcm:['Ra','La','k','J','TL'],vm:['mode'],am:['mode']};
const effP=c=>simMode==='simple'?Object.assign({},c.pu,IDEAL[c.type]||{}):Object.assign({},c.pu);
function refreshP(c){c.p=effP(c);}
function setP(c,k,v){c.pu[k]=v;refreshP(c);}

/* tilastot ja tekstit komponenttien lukemiin */
function stv(c,k){const s=c.stat;if(s&&Number.isFinite(s[k]))return s[k];const m=c.inst;if(!m)return NaN;
  if(k==='Uavg'||k==='Urms')return k==='Urms'?Math.abs(m.v):m.v;if(k==='Iavg'||k==='Irms')return k==='Irms'?Math.abs(m.i):m.i;return NaN;}
function isOn(c,j){const e=c.els&&c.els[j];return !!(e&&e.s&&e.s.on);}
function gateTxt(c){const p=c.p;if(p.g==='on')return tr('aina johtava','always on','dauernd ein');if(p.g==='off')return tr('aina estävä','always off','dauernd aus');
  if(p.g==='pwm')return `D ${nf(p.inv==='kylla'?100-p.D:p.D,0)} % · ${nf(p.f,p.f<10?1:0)} kHz`;return `SPWM${p.inv==='kylla'?' ¬':''} ${nf(p.ph,0)}°`;}
function adRead(c,k,u){const a=stv(c,k+'avg'),r=stv(c,k+'rms');return Math.abs(a)<0.5*Math.abs(r)?`${si(r,u)}~`:si(a,u);}
function meterTxt(c){const k=TY[c.type].meter,u=k==='U'?'V':'A';const v=c.p.mode==='ac'?stv(c,k+'rms'):stv(c,k+'avg');return `${si(v,u)}${c.p.mode==='ac'?' ~':' ⎓'}`;}
function HELP(fields){return fields.map(([k,l,u,v])=>`<div class="fld"><span>${L2(l)}</span><span class="inp"><input type="number" data-h="${k}" value="${v}" step="any"><em>${u}</em></span></div>`).join('')+'<div class="res" data-hres></div>';}

/* ---------- geometria ---------- */
function rotP(x,y,r){switch(((r%360)+360)%360){case 90:return[-y,x];case 180:return[-x,-y];case 270:return[y,-x];default:return[x,y];}}
function portsW(c){return TY[c.type].ports.map(p=>{const[x,y]=rotP(p.x,p.y,c.rot),[dx,dy]=rotP(p.d[0],p.d[1],c.rot);
  return {n:p.n,lab:p.lab,x:c.x+x,y:c.y+y,d:[Math.round(dx),Math.round(dy)],k:c.id+':'+p.n,c};});}
function bbW(c){const b=TY[c.type].bb,a=rotP(b[0],b[1],c.rot),d=rotP(b[2],b[3],c.rot);
  return [c.x+Math.min(a[0],d[0]),c.y+Math.min(a[1],d[1]),c.x+Math.max(a[0],d[0]),c.y+Math.max(a[1],d[1])];}
function portByKey(k){const i=k.indexOf(':');const c=byId[k.slice(0,i)];if(!c)return null;const pn=k.slice(i+1);return portsW(c).find(p=>p.n===pn)||null;}
function route(p1,p2){
  const s1={x:p1.x+p1.d[0]*12,y:p1.y+p1.d[1]*12},s2={x:p2.x+p2.d[0]*12,y:p2.y+p2.d[1]*12};
  const mx=(s1.x+s2.x)/2,my=(s1.y+s2.y)/2;
  const cands=[[{x:s2.x,y:s1.y}],[{x:s1.x,y:s2.y}],[{x:mx,y:s1.y},{x:mx,y:s2.y}],[{x:s1.x,y:my},{x:s2.x,y:my}]];
  let best=null,bc=Infinity;

/* ---------- topologia ja ratkaisija ----------
   Muunneltu solmupistemenetelmä (MNA). Kondensaattorit ja kelat diskretoidaan implisiittisellä Eulerin menetelmällä

function rebuild(){

    const loc={};const nodeOf=nm=>{if(c.node[nm]!==undefined)return c.node[nm];if(loc[nm]===undefined)loc[nm]=++extra;return loc[nm];};

     dt,Tw,fq,autoGnd,nodeOfKey,v:new Float64Array(nNodes+1),x:new Float64Array(n),b:new Float64Array(n),wT:0,

let vScale=400;
function vcol(v){const f=clamp(v/vScale,-1,1);const g=[122,135,148];const tgt=f<0?[46,111,208]:[210,59,46];const a=Math.abs(f);
  return `rgb(${Math.round(g[0]+(tgt[0]-g[0])*a)},${Math.round(g[1]+(tgt[1]-g[1])*a)},${Math.round(g[2]+(tgt[2]-g[2])*a)})`;}

/* johdinvirrat: liitäntävirroista puun karsinnalla */
function termCurrents(){const T={};
  for(const c of comps)for(const e of c.els||[]){const add=(pn,v)=>{if(pn){const k=c.id+':'+pn;T[k]=(T[k]||0)+v;}};
    if(e.t==='X'){add(e.pa,e.i);add(e.pb,-e.i);add(e.pa2,-e.nr*e.i);add(e.pb2,e.nr*e.i);}else{add(e.pa,e.i);add(e.pb,-e.i);}}
  return T;}
function wireCurrents(){
  const Tc=termCurrents();const inj={},adj={};
  for(const c of comps)for(const p of TY[c.type].ports){const k=c.id+':'+p.n;inj[k]=-(Tc[k]||0);adj[k]=[];}
  for(const w of wires){w.f=NaN;if(adj[w.a]&&adj[w.b]){adj[w.a].push(w);adj[w.b].push(w);}}
  const deg={},done=new Set(),queue=[];
  for(const k in adj){deg[k]=adj[k].length;if(deg[k]===1)queue.push(k);}
  while(queue.length){const v=queue.pop();if(deg[v]!==1)continue;const w=adj[v].find(x=>!done.has(x.id));if(!w)continue;
    done.add(w.id);const u=w.a===v?w.b:w.a;w.f=(w.a===v?1:-1)*inj[v];inj[u]+=inj[v];deg[v]--;deg[u]--;if(deg[u]===1)queue.push(u);}
}

/* ---------- anturit ja oskilloskooppi ---------- */
const CHC=['#D69A00','#0E8FB8','#C2399A','#2E9E4F'];
const SC={tb:5e-3,trig:{ch:0,lvl:0,edge:1,mode:'auto'},run:true,binW:5e-5,N:1000,CAP:4000,frozen:null,single:false};
const TBS=[];for(const e of [-6,-5,-4,-3,-2,-1,0])for(const m of [1,2,5])TBS.push(m*Math.pow(10,e));
const SCL=[];for(const e of [-3,-2,-1,0,1,2,3])for(const m of [1,2,5])SCL.push(m*Math.pow(10,e));
function setTimebase(tb){SC.tb=tb;SC.binW=tb*10/SC.N;SC.frozen=null;for(const pr of probes)initBuf(pr);}
function initBuf(pr){const C=SC.CAP;pr.B={avg:new Float32Array(C),mn:new Float32Array(C),mx:new Float32Array(C),sq:new Float32Array(C),head:0,cnt:0,gEnd:0,lt:undefined,lv:0,bs:0,s:0,s2:0,T:0,bmn:Infinity,bmx:-Infinity};}
function probeTargetComp(pr){if(pr.target.startsWith('n:')){const k=pr.target.slice(2);return byId[k.slice(0,k.indexOf(':'))];}return byId[pr.target];}
function setupProbe(pr){
  if(!pr.B)initBuf(pr);
  if(pr.target.startsWith('n:')){const k=pr.target.slice(2);const n=S.nodeOfKey[k];pr.fn=n===undefined?null:()=>S.v[n];return;}
  const c=byId[pr.target];if(!c||!c.node){pr.fn=null;return;}
  const d=measDesc(c,pr.sub||null);
  pr.fn=pr.kind==='U'?()=>S.v[d.a]-S.v[d.b]:()=>{let i=0;for(const [e,s] of d.cur)i+=s*e.i;return i;};
}
function feedProbe(pr,t,v){const B=pr.B,bw=SC.binW;if(!B)return;
  if(B.lt===undefined||t<B.lt-1e-12){B.lt=t;B.lv=v;B.bs=Math.floor(t/bw+1e-9)*bw;B.s=B.s2=B.T=0;B.bmn=Infinity;B.bmx=-Infinity;B.gEnd=Math.round(B.bs/bw);return;}
  let t0=B.lt,v0=B.lv;const dv=(v-v0)/Math.max(t-t0,1e-30);let guard=0;
  while(t0<t-1e-15&&guard++<5000){const be=B.bs+bw,t1=Math.min(t,be),v1=v0+dv*(t1-t0),d=t1-t0;
    B.s+=(v0+v1)/2*d;B.s2+=(v0*v0+v0*v1+v1*v1)/3*d;B.T+=d;const lo=Math.min(v0,v1),hi=Math.max(v0,v1);if(lo<B.bmn)B.bmn=lo;if(hi>B.bmx)B.bmx=hi;
    if(t1>=be-1e-15){const h=B.head;B.avg[h]=B.T>0?B.s/B.T:v1;B.sq[h]=B.T>0?B.s2/B.T:v1*v1;B.mn[h]=B.bmn;B.mx[h]=B.bmx;
      B.head=(h+1)%SC.CAP;B.cnt=Math.min(B.cnt+1,SC.CAP);B.bs=be;B.gEnd=Math.round(be/bw);B.s=B.s2=B.T=0;B.bmn=Infinity;B.bmx=-Infinity;}
    t0=t1;v0=v1;}
  B.lt=t;B.lv=v;}
/* globaali binin indeksi g → paikka puskurissa (tai -1) */
function bidx(B,g){const back=B.gEnd-1-g;if(back<0||back>=B.cnt)return -1;return (B.head-1-back+SC.CAP*2)%SC.CAP;}
function scopeWindow(){
  const tp=probes.find(p=>p.ch===SC.trig.ch)||probes[0];if(!tp||!tp.B||!tp.B.cnt)return null;
  if(!SC.run&&SC.frozen!==null)return SC.frozen;
  const B=tp.B,N=SC.N,pre=100,lvl=SC.trig.lvl,ed=SC.trig.edge,gLast=B.gEnd-1;
  let found=null;
  if(SC.trig.mode!=='free')
    for(let g=gLast-N+1+pre;g>gLast-B.cnt+pre+1;g--){const i1=bidx(B,g),i0=bidx(B,g-1);if(i1<0||i0<0)break;
      const a=B.avg[i0],b=B.avg[i1];if(ed>0?(a<lvl&&b>=lvl):(a>lvl&&b<=lvl)){found=g-pre;break;}}
  let g0;
  if(found!==null){g0=found;SC.lastTrig=g0;if(SC.trig.mode==='single'&&SC.run){SC.frozen=g0;setScopeRun(false);SC.frozen=g0;return g0;}}
  else if(SC.trig.mode==='single')return SC.frozen;
  else if(SC.trig.mode==='normal'&&SC.lastTrig!==undefined&&gLast-SC.lastTrig<B.cnt-N)g0=SC.lastTrig;
  else if(SC.trig.mode==='normal'&&SC.lastTrig===undefined)return null;
  else g0=gLast-N+1;

  return g0;}
function chData(pr,g0){const B=pr.B,N=SC.N;const out={avg:new Float32Array(N),mn:new Float32Array(N),mx:new Float32Array(N),sq:new Float32Array(N),ok:new Uint8Array(N),n:0};
  if(!B)return out;for(let k=0;k<N;k++){const i=bidx(B,g0+k);if(i<0)continue;out.avg[k]=B.avg[i];out.mn[k]=B.mn[i];out.mx[k]=B.mx[i];out.sq[k]=B.sq[i];out.ok[k]=1;out.n++;}return out;}
function chMeas(D){if(!D.n)return null;let s=0,s2=0,mn=Infinity,mx=-Infinity,n=0;
  for(let k=0;k<D.avg.length;k++)if(D.ok[k]){s+=D.avg[k];s2+=D.sq[k];if(D.mn[k]<mn)mn=D.mn[k];if(D.mx[k]>mx)mx=D.mx[k];n++;}
  const avg=s/n,rms=Math.sqrt(Math.max(s2/n,0)),pp=mx-mn;
  let f=NaN;if(pp>1e-9){const mid=(mx+mn)/2,h=pp*0.1;let st=0,first=-1,last=-1,cnt=0;
    for(let k=0;k<D.avg.length;k++){if(!D.ok[k])continue;const v=D.avg[k];if(st<=0&&v>mid+h){if(st===-1){cnt++;if(first<0)first=k;last=k;}st=1;}else if(v<mid-h)st=-1;}
    if(cnt>=2&&last>first)f=(cnt-1)/((last-first)*SC.binW);}

function probeLabel(pr){if(pr.target.startsWith('n:')){const k=pr.target.slice(2),p=portByKey(k);return p?`U(${p.c.label}.${p.lab||p.n})`:'?';}

let lastMeas=[];

  const css=getComputedStyle(document.documentElement);const bg=css.getPropertyValue('--scr').trim()||'#0D1418',grid=css.getPropertyValue('--scrgrid').trim()||'#2A3A40',txt=css.getPropertyValue('--scrtxt').trim()||'#9FB3BA';

  g.strokeStyle=grid;g.lineWidth=2;g.beginPath();g.moveTo(0,Math.round(cy)+0.5);g.lineTo(W,Math.round(cy)+0.5);g.moveTo(W/2,top);g.lineTo(W/2,bot);g.stroke();

  g.fillText(right,6,H-9);

let lastTs=null,frame=0,simRate=0,rateAcc=0,rateT=0;
const reduce=window.matchMedia('(prefers-reduced-motion: reduce)').matches;
function loop(ts){

  if(running&&S.n>0&&!numErr){const t0=performance.now(),want=speed*fdt;let n=Math.ceil(want/S.dt),done=0;const tStart=simT;
    while(done<n){const m=Math.min(200,n-done);for(let i=0;i<m;i++)stepSim();done+=m;if(performance.now()-t0>14)break;}
    rateAcc+=simT-tStart;rateT+=fdt;if(rateT>0.5){simRate=rateAcc/rateT;rateAcc=0;rateT=0;}}

function copySel(){const ids=selIds();if(!ids.length)return false;const set=new Set(ids);

    wires:wires.filter(w=>set.has(w.a.split(':')[0])&&set.has(w.b.split(':')[0])).map(w=>({a:w.a,b:w.b,pts:w.pts?w.pts.map(p=>({...p})):null})),n:0};

  wires:wires.map(w=>{const o={a:w.a,b:w.b};if(w.pts&&w.pts.length)o.pts=w.pts.map(p=>({x:r1(p.x),y:r1(p.y)}));return o;}),

function niceTb(x){for(const v of TBS)if(v>=x*0.999)return v;return TBS[TBS.length-1];}
function load(json,fit=true){
  const d=typeof json==='string'?JSON.parse(json):json;if(!d||!Array.isArray(d.comps))throw new Error(tr('Tiedostosta puuttuu komponenttilista.','The file has no component list.','Die Datei enthält keine Bauteilliste.'));

    let ch=Number.isInteger(p.ch)&&p.ch>=0&&p.ch<4&&!used.has(p.ch)?p.ch:[0,1,2,3].find(i=>!used.has(i));used.add(ch);

function endDrag(e){

function hoverTip(e){

function subFor(c,w){const t=TY[c.type];if(!t.subs)return null;const ps=portsW(c);let best=null,bd=Infinity;
  for(const p of ps){const d=Math.hypot(p.x-w.x,p.y-w.y);if(d<bd){bd=d;best=p;}}
  if(!best)return t.subs[0];if(c.type==='tr')return best.n[0]==='S'?'S':'P';if(c.type==='v3')return best.n==='N'?'L1':best.n;return t.subs[0];}
function placeProbe(w,portEl,compEl,wireEl){
  const k=tool;
  if(compEl){const c=byId[compEl.dataset.id];if(c.type==='gnd')return;if(k==='I'&&c.type==='vm'){flashWarn(tr('Jännitemittarin läpi ei kulje virtaa.','No current flows through a voltmeter.','Durch einen Spannungsmesser fließt kein Strom.'));return;}
    addProbe(k,c.id,subFor(c,w));return;}
  let port=null;
  if(portEl)port=portByKey(portEl.dataset.port);
  else if(wireEl){const wi=wires.find(x=>x.id===wireEl.dataset.w);port=portByKey(wi.a);}
  if(port){if(k==='U')addProbe('U','n:'+port.k,null);else flashWarn(tr('Virta-anturi kiinnitetään komponenttiin: klikkaa komponenttia.','The current probe attaches to a component: click a component.','Die Stromzange wird an einem Bauteil angesetzt: Klicken Sie ein Bauteil an.'));}
}
function segPick(wi,pt){
  const a=portByKey(wi.a),b=portByKey(wi.b);if(!a||!b)return {pts:null};
  let P=(wi.path||wirePts(wi,a,b)).map(p=>({x:p.x,y:p.y}));let bi=0,bd=Infinity;
  for(let i=0;i<P.length-1;i++){const p=P[i],q=P[i+1];const t=c01(((pt.x-p.x)*(q.x-p.x)+(pt.y-p.y)*(q.y-p.y))/(((q.x-p.x)**2+(q.y-p.y)**2)||1));
    const d=Math.hypot(pt.x-(p.x+t*(q.x-p.x)),pt.y-(p.y+t*(q.y-p.y)));if(d<bd){bd=d;bi=i;}}
  if(bi===0){P.unshift({...P[0]});bi=1;}if(bi===P.length-2){P.push({...P[P.length-1]});}
  const horiz=Math.abs(P[bi].y-P[bi+1].y)<0.5;return {pts:P,i:bi,horiz,o:horiz?P[bi].y:P[bi].x};
}

<h3>Ohjaus</h3><p>Kytkin avataan ja suljetaan klikkaamalla. MOSFETin ja IGBT:n hilaohjaus (PWM tai sini-PWM, taajuus, pulssisuhde, vaihe, käänteinen ohjaus) ja tyristorin ohjauskulma asetetaan ominaisuuspaneelissa. Tyristorin ohjauskulma lasketaan siitä hetkestä, kun sen anodi–katodijännite muuttuu positiiviseksi (luonnollinen kommutointihetki).</p>
<h3>Oskilloskooppi</h3><p>Valitse Jänniteanturi tai Virta-anturi ja klikkaa komponenttia: jänniteanturi mittaa jännitteen komponentin yli, virta-anturi virran sen läpi. Johdinta klikkaamalla jänniteanturi mittaa solmun jännitteen maata vasten. Kanavia on neljä. Aikataso, liipaisu (kanava, taso, reuna, tila) sekä kanavien asteikot ja siirrot asetetaan oskilloskoopin oikeassa reunassa. Mittaustaulukko näyttää näytön ajalta keskiarvon, tehollisarvon, ääriarvot ja taajuuden. Virran suunta: passiivisilla komponenteilla liitännästä 1 (tai A, D, C, +) sisään, lähteillä plusnavasta tai L-navasta ulos.</p>
<h3>Yksinkertainen ja kehittynyt malli</h3><p>Yksinkertaisessa mallissa puolijohteet ovat ihanteellisia kytkimiä (ei kynnysjännitettä), lähteillä ei ole sisäistä impedanssia, kondensaattoreilla ja keloilla ei ole häviöitä ja muuntaja on ihanteellinen. Kehittyneessä mallissa ovat mukana kynnysjännitteet, johtotilan resistanssit, lähteen resistanssi ja induktanssi (kommutointi), ESR, käämiresistanssit, muuntajan hajainduktanssi ja magnetointi-induktanssi sekä kuollut aika.</p>
<h3>Malli ja rajoitukset</h3><p>Piiri ratkaistaan solmupistemenetelmällä (MNA). Kondensaattorit ja kelat diskretoidaan implisiittisellä Eulerin menetelmällä, ja aika-askel valitaan taajuuksien mukaan (enintään 1/2000 verkkojakson ja 1/200 kytkentäjakson). Puolijohteet ovat paloittain lineaarisia: johtavana kynnysjännite ja resistanssi, estävänä 1 MΩ. Kytkentähäviöitä, puolijohteiden kapasitansseja, lämpenemistä eikä muuntajan kyllästymistä mallinneta. Tulokset kuvaavat ilmiöitä mutta eivät korvaa komponenttivalmistajan mitoitustyökaluja.</p>
<p class="mcopy">Tekijä: Juho Pirttilahti, Seinäjoen ammattikorkeakoulu (SEAMK), 2026. Suunnittelu, sisältö ja validointi: Juho Pirttilahti. Ohjelmakoodi toteutettu tekoälyavusteisesti (Claude, Anthropic). Ohjelma on lisensoitu <a href="https://creativecommons.org/licenses/by/4.0/deed.fi" target="_blank" rel="license noopener">Creative Commons Nimeä 4.0 Kansainvälinen -lisenssillä (CC BY 4.0)</a>. Saat kopioida, jakaa ja muokata sitä mihin tahansa tarkoitukseen, kunhan mainitset tekijän ja oppilaitoksen, merkitset lisenssin ja kerrot tekemistäsi muutoksista.</p>`,
`<h2>Help</h2>
<p>Full user manual with examples and exercises: <a href="https://jipirtti.github.io/Elektroniikkasimulaattori/docs/user-manual.html" target="_blank" rel="noopener">Electronics Simulator user manual</a>.</p>
<h3>Building a circuit</h3><p>Drag a component from the left onto the canvas, or click it. Connect a wire by dragging from one terminal to another. Several wires can be connected to the same terminal. Mark the 0 V reference with a ground component; without one, the negative or N terminal of a source is used. Reshape a wire by dragging a section of it. Select several components by dragging with Shift held down or with Shift+click.</p>
<h3>Operating</h3><p>Click a switch to open or close it. The gate drive of a MOSFET or IGBT (PWM or sine PWM, frequency, duty cycle, phase, inverted drive) and the firing angle of a thyristor are set in the properties panel. The thyristor firing angle is measured from the instant its anode–cathode voltage becomes positive (natural commutation instant).</p>
<h3>Oscilloscope</h3><p>Choose Voltage probe or Current probe and click a component: the voltage probe measures the voltage across it, the current probe the current through it. Clicking a wire with the voltage probe measures the node voltage to ground. There are four channels. Timebase, trigger (channel, level, edge, mode) and channel scales and offsets are set on the right of the oscilloscope. The measurement table shows mean, RMS, extremes and frequency over the screen. Current direction: into terminal 1 (or A, D, C, +) for passive components, out of the + or L terminal for sources.</p>
<h3>Simple and advanced model</h3><p>In the simple model semiconductors are ideal switches (no threshold voltage), sources have no internal impedance, capacitors and inductors are lossless and the transformer is ideal. The advanced model includes threshold voltages, on-state resistances, source resistance and inductance (commutation), ESR, winding resistances, transformer leakage and magnetising inductance, and dead time.</p>
<h3>Model and limitations</h3><p>The circuit is solved with modified nodal analysis (MNA). Capacitors and inductors are discretised with the implicit Euler method, and the time step follows the frequencies (at most 1/2000 of a mains period and 1/200 of a switching period). Semiconductors are piecewise linear: threshold voltage and resistance when conducting, 1 MΩ when blocking. Switching losses, semiconductor capacitances, heating and transformer saturation are not modelled. The results illustrate the phenomena but do not replace component manufacturers' design tools.</p>

<p>Vollständige Bedienungsanleitung mit Beispielen und Übungen: <a href="https://jipirtti.github.io/Elektroniikkasimulaattori/docs/bedienungsanleitung.html" target="_blank" rel="noopener">Bedienungsanleitung des Elektronik-Simulators</a>.</p>
<h3>Schaltung aufbauen</h3><p>Ziehen Sie ein Bauteil von links auf die Zeichenfläche oder klicken Sie es an. Eine Leitung verbinden Sie, indem Sie von einem Anschluss zu einem anderen ziehen. An einen Anschluss können mehrere Leitungen angeschlossen werden. Kennzeichnen Sie das 0-V-Bezugspotenzial mit einem Massesymbol; ohne Masse wird der Minus- oder N-Anschluss einer Quelle verwendet. Den Verlauf einer Leitung ändern Sie, indem Sie einen Abschnitt ziehen. Mehrere Bauteile wählen Sie mit gedrückter Umschalttaste durch Ziehen oder mit Umschalt+Klick aus.</p>
<h3>Bedienen</h3><p>Ein Klick auf einen Schalter öffnet oder schließt ihn. Die Ansteuerung eines MOSFET oder IGBT (PWM oder Sinus-PWM, Frequenz, Tastgrad, Phase, invertierte Ansteuerung) und der Zündwinkel eines Thyristors werden im Eigenschaftenfeld eingestellt. Der Zündwinkel wird ab dem Zeitpunkt gemessen, ab dem die Anoden-Kathoden-Spannung positiv wird (natürlicher Kommutierungszeitpunkt).</p>
<h3>Oszilloskop</h3><p>Wählen Sie Spannungstastkopf oder Stromzange und klicken Sie ein Bauteil an: Der Spannungstastkopf misst die Spannung am Bauteil, die Stromzange den Strom durch das Bauteil. Ein Klick mit dem Spannungstastkopf auf eine Leitung misst die Knotenspannung gegen Masse. Es gibt vier Kanäle. Zeitbasis, Trigger (Kanal, Pegel, Flanke, Betriebsart) sowie Skalen und Offsets der Kanäle werden rechts neben dem Oszilloskop eingestellt. Die Messwerttabelle zeigt Mittelwert, Effektivwert, Extremwerte und Frequenz über den Bildschirm. Stromrichtung: bei passiven Bauteilen in Anschluss 1 (bzw. A, D, C, +) hinein, bei Quellen aus dem Anschluss + bzw. L heraus.</p>
<h3>Einfaches und erweitertes Modell</h3><p>Im einfachen Modell sind Halbleiter ideale Schalter (ohne Schleusenspannung), Quellen haben keine Innenimpedanz, Kondensatoren und Spulen sind verlustfrei und der Transformator ist ideal. Das erweiterte Modell berücksichtigt Schleusenspannungen, Durchlasswiderstände, Widerstand und Induktivität der Quelle (Kommutierung), ESR, Wicklungswiderstände, Streu- und Hauptinduktivität des Transformators sowie die Totzeit.</p>
<h3>Modell und Grenzen</h3><p>Die Schaltung wird mit der modifizierten Knotenpunktanalyse (MNA) gelöst. Kondensatoren und Spulen werden mit dem impliziten Euler-Verfahren diskretisiert; der Zeitschritt richtet sich nach den Frequenzen (höchstens 1/2000 einer Netzperiode und 1/200 einer Schaltperiode). Halbleiter sind stückweise linear: im leitenden Zustand Schleusenspannung und Widerstand, im sperrenden Zustand 1 MΩ. Schaltverluste, Halbleiterkapazitäten, Erwärmung und Sättigung des Transformators werden nicht modelliert. Die Ergebnisse veranschaulichen die Vorgänge, ersetzen aber nicht die Auslegungswerkzeuge der Bauteilhersteller.</p>

function measureFor(l,kind,sub,sec){const c=byLabel(l);const d=measDesc(c,sub||null);const n=Math.max(1,Math.round(sec/S.dt));let s=0,s2=0,mn=Infinity,mx=-Infinity,T=0;setRun(false);

function svgImg(s,scale){return new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=()=>rej(new Error('SVG'));

/* ---- selite: elementtipuu muutetaan väripaloiksi ja teksteiksi ---- */
function legendTokens(roots){const out=[];
  const sw=el=>{const cs=getComputedStyle(el),r=el.getBoundingClientRect();if(!r.width&&!r.height)return null;
    const cols=(cs.backgroundImage||'').match(/rgba?\([^)]+\)|#[0-9a-fA-F]{3,8}/g);
    if(cols&&cols.length>1)return{t:'grad',cols,w:Math.min(120,r.width||60),h:Math.max(6,Math.min(12,r.height||8))};
    const bg=cs.backgroundColor,bs=cs.borderTopStyle,bc=cs.borderTopColor,bl=cs.borderLeftWidth;
    if(bs==='dashed'||bs==='dotted')return{t:'dash',col:bc,w:Math.max(14,r.width),dot:bs==='dotted'};
    if(bg&&!/rgba\(0, 0, 0, 0\)|transparent/.test(bg))return{t:'box',col:bg,w:Math.max(4,Math.min(40,r.width)),h:Math.max(3,Math.min(14,r.height)),round:parseFloat(cs.borderTopLeftRadius)||0};
    if(parseFloat(bl)>=3)return{t:'box',col:cs.borderLeftColor,w:4,h:14};return null;};
  const walk=(n,grp)=>{if(n.nodeType===3){const s=n.textContent.replace(/\s+/g,' ').trim();if(s){const cs=getComputedStyle(n.parentElement);grp.push({t:'txt',s,col:cs.color,b:parseInt(cs.fontWeight,10)>=600});}return;}
    if(n.nodeType!==1)return;const cs=getComputedStyle(n);if(cs.display==='none'||cs.visibility==='hidden'||n.hasAttribute('data-skv-ohita'))return;
    if(n.tagName==='SELECT'){const o=n.options[n.selectedIndex];if(o)grp.push({t:'txt',s:o.text.trim(),col:cs.color});return;}
    if(n.tagName==='INPUT'){if(n.type!=='checkbox'&&n.type!=='radio'&&n.value)grp.push({t:'txt',s:n.value,col:cs.color});return;}
    if(/^(BUTTON|SCRIPT|STYLE|CANVAS|SVG|svg)$/.test(n.tagName))return;
    if(!n.childNodes.length||![...n.childNodes].some(c=>c.nodeType===1||(c.nodeType===3&&c.textContent.trim()))){const s=sw(n);if(s)grp.push(s);
      if(n.childNodes.length===0)return;}
    else{const s=(cs.borderLeftStyle!=='none'&&parseFloat(cs.borderLeftWidth)>=3)?{t:'box',col:cs.borderLeftColor,w:4,h:14}:null;if(s)grp.push(s);}
    n.childNodes.forEach(c=>walk(c,grp));};
  for(const r of roots){if(!r)continue;const kids=[...r.children].filter(c=>getComputedStyle(c).display!=='none');
    if(kids.length>1){kids.forEach(k=>{const g=[];walk(k,g);if(g.length)out.push(g);});}else{const g=[];walk(r,g);if(g.length)out.push(g);}}
  return out;}

/* ---- kuvan kokoaminen ---- */
const FONT='"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif';
function textOf(x){if(!x)return'';if(typeof x==='function')return String(x()||'');const el=one(x);if(!el)return'';
  const c=el.cloneNode(true);c.querySelectorAll('.skv-btn').forEach(b=>b.remove());return c.textContent.replace(/\s+/g,' ').trim();}
function capture(k){const o=C.kaaviot.find(x=>x.id===k);if(!o)throw new Error('kaavio '+k);
  return withLight(dpr=>{const items=[];let raw=typeof o.kohde==='function'?o.kohde():[one(o.kohde)];raw=(raw||[]).filter(Boolean);
    for(const it of raw){const el=it.el||it;let img=null,w,h,svg=null;
      if(el.tagName==='CANVAS'){const r=el.getBoundingClientRect();w=r.width;h=r.height;if(!w||!h)continue;const c=document.createElement('canvas');c.width=el.width;c.height=el.height;c.getContext('2d').drawImage(el,0,0);img=c;}
      else if(el.tagName.toLowerCase()==='svg'){svg=svgSnap(el,o.svg);w=svg.w;h=svg.h;}
      else continue;
      items.push({img,svg,w,h,nimi:it.nimi||'',arvo:it.arvo||'',vari:it.vari||''});}
    const legend=o.selite?legendTokens(typeof o.selite==='function'?o.selite():[one(o.selite)]):[];
    if(!items.length)throw new Error(t('empty'));
    return{o,items,legend,title:textOf(o.otsikko==='auto'?autoHead(o):o.otsikko),dpr};});}
async function compose(cap){const S=cap.dpr,PAD=16,FOOT=11.5,TIT=17,LEG=13;const rows=cap.o.asettelu==='rivit';const LW=rows?190:0;
  for(const it of cap.items)if(it.svg){const sc=Math.min(S,5000/Math.max(it.w,it.h));it.img=await svgImg(it.svg,sc);it.sc=sc;}
  const d=new Date(),ds=lang()==='en'?d.toISOString().slice(0,10):d.getDate()+'.'+(d.getMonth()+1)+'.'+d.getFullYear();
  const nimi=C.nimi[lang()]||C.nimi.en||C.nimi.fi,url=C.repo?'jipirtti.github.io/'+C.repo.split('/')[1]+'/':'';
  const foot=`${nimi} · Juho Pirttilahti, SEAMK · CC BY 4.0${url?' · '+url:''} · ${ds}`;
  const m=document.createElement('canvas').getContext('2d');m.font=FOOT+'px '+FONT;const footW=m.measureText(foot).width;
  m.font='600 '+TIT+'px '+FONT;const titW=cap.title?m.measureText(cap.title).width:0;
  const chartW=Math.max(260,...cap.items.map(i=>i.w+LW));const W=Math.ceil(Math.max(chartW,footW+4,titW+4,360)+2*PAD);
  const lay=[];let x=0,y=0,lh=LEG+8;const maxW=W-2*PAD;
  for(const g of cap.legend){let gw=0;const seg=g.map(tk=>{let w;if(tk.t==='txt'){m.font=(tk.b?'600 ':'')+LEG+'px '+FONT;w=m.measureText(tk.s).width;}else w=tk.w;gw+=w+5;return w;});gw-=5;
    if(x>0&&x+gw>maxW){x=0;y+=lh;}let xx=x;g.forEach((tk,i)=>{lay.push({tk,x:xx,y,w:seg[i]});xx+=seg[i]+5;});x=xx-5+14;}
  const legH=cap.legend.length?y+lh:0;
  const titleH=cap.title?TIT+12:0;const NH=17,itemsH=cap.items.reduce((a,i)=>a+i.h+(!rows&&i.nimi?NH+3:0)+(rows?8:(cap.items.length>1?10:0)),0);
  const H=Math.ceil(PAD+titleH+itemsH+(legH?legH+8:0)+FOOT+14+PAD);
  const cv=document.createElement('canvas');cv.width=Math.round(W*S);cv.height=Math.round(H*S);const g=cv.getContext('2d');g.scale(S,S);
  g.fillStyle='#FFFFFF';g.fillRect(0,0,W,H);g.textBaseline='alphabetic';
  let cy=PAD;
  if(cap.title){g.fillStyle='#17212B';g.font='600 '+TIT+'px '+FONT;g.fillText(cap.title,PAD,cy+TIT);cy+=titleH;}
  for(const it of cap.items){let cx=PAD;
    if(rows){if(it.vari){g.fillStyle=it.vari;g.fillRect(PAD,cy+2,4,it.h-4);}g.fillStyle='#56636F';g.font='13px '+FONT;g.fillText(it.nimi,PAD+12,cy+16);
      g.fillStyle='#17212B';g.font='600 18px '+FONT;g.fillText(it.arvo,PAD+12,cy+38);cx=PAD+LW;}
    if(!rows&&it.nimi){g.fillStyle='#17212B';g.font='600 13px '+FONT;g.fillText(it.nimi,PAD,cy+13);cy+=NH+3;}
    g.drawImage(it.img,cx,cy,it.w,it.h);cy+=it.h+(rows?8:(cap.items.length>1?10:0));}
  if(legH){cy+=8;for(const l of lay){const tk=l.tk,ly=cy+l.y,mid=ly+lh/2-1;
      if(tk.t==='txt'){g.fillStyle=tk.col||'#56636F';g.font=(tk.b?'600 ':'')+LEG+'px '+FONT;g.fillText(tk.s,PAD+l.x,ly+LEG+1);}
      else if(tk.t==='grad'){const gr=g.createLinearGradient(PAD+l.x,0,PAD+l.x+tk.w,0);tk.cols.forEach((c,i)=>gr.addColorStop(i/(tk.cols.length-1),c));g.fillStyle=gr;g.fillRect(PAD+l.x,mid-tk.h/2,tk.w,tk.h);}
      else if(tk.t==='dash'){g.save();g.strokeStyle=tk.col;g.lineWidth=2;g.setLineDash(tk.dot?[2,3]:[5,3]);g.beginPath();g.moveTo(PAD+l.x,mid);g.lineTo(PAD+l.x+tk.w,mid);g.stroke();g.restore();}
      else{g.fillStyle=tk.col;g.fillRect(PAD+l.x,mid-tk.h/2,tk.w,tk.h);}}
    cy+=legH;}
  g.fillStyle='#56636F';g.font=FOOT+'px '+FONT;g.fillText(foot,PAD,H-PAD+2);
  return cv;}
async function render(k){return compose(capture(k));}
const toBlob=cv=>new Promise((res,rej)=>cv.toBlob(b=>b?res(b):rej(new Error('PNG')),'image/png'));

/* ---- painikkeet, ilmoitus ja varaikkuna ---- */
function css(){if(document.getElementById('skv-css'))return;const s=document.createElement('style');s.id='skv-css';
  s.textContent=`.skv-btn{font:inherit;font-size:13px;line-height:1.2;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:3px 9px;min-height:28px;cursor:pointer;white-space:nowrap;flex:none}
.skv-btn:hover{border-color:var(--muted)}.skv-btn:focus-visible{outline:3px solid var(--sel,#1E5DBA);outline-offset:1px}.skv-btn[disabled]{opacity:.6;cursor:progress}
.skv-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 10px}.skv-head>h4,.skv-head>h3,.skv-head>strong{margin:0}
.skv-head{margin:0 0 4px}.skv-lisaa{margin-left:auto}
.skv-kulma{position:absolute;top:10px;right:10px;z-index:6;box-shadow:0 1px 4px rgba(0,0,0,.15)}
.skv-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:300;background:var(--ink);color:var(--paper);padding:8px 16px;border-radius:999px;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.25);pointer-events:none}
.skv-modal{position:fixed;inset:0;z-index:250;background:rgba(10,16,22,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.skv-box{background:var(--paper);color:var(--ink);border-radius:12px;max-width:min(1000px,96vw);max-height:92vh;overflow:auto;padding:16px 18px;box-shadow:0 20px 60px rgba(0,0,0,.35)}
.skv-box img{display:block;max-width:100%;height:auto;border:1px solid var(--line);border-radius:6px;margin:8px 0;background:#fff}
.skv-box h2{margin:0 0 6px;font-size:19px}.skv-box p{margin:4px 0;font-size:14px}.skv-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end;align-items:center}
.skv-row a{color:var(--sel,#1E5DBA)}`;document.head.appendChild(s);}
function toast(msg){const d=document.createElement('div');d.className='skv-toast';d.setAttribute('role','status');d.setAttribute('aria-live','polite');d.textContent=msg;document.body.appendChild(d);setTimeout(()=>d.remove(),2600);}
function fallback(cv,k,err){const url=cv.toDataURL('image/png');const m=document.createElement('div');m.className='skv-modal';m.setAttribute('role','dialog');m.setAttribute('aria-modal','true');m.id='skvModal';
  const fn=(C.nimi[lang()]||C.nimi.en||C.nimi.fi||'kaavio').toLowerCase().replace(/[^a-z0-9äöü]+/g,'-')+'-'+k+'.png';
  m.innerHTML=`<div class="skv-box"><h2></h2><p></p><img alt=""><div class="skv-row"><a download></a><button type="button" class="skv-btn"></button></div></div>`;
  m.querySelector('h2').textContent=t('fbH');m.querySelector('p').textContent=t('fbP');const im=m.querySelector('img');im.src=url;im.alt=t('fbH');
  const a=m.querySelector('a');a.href=url;a.download=fn;a.textContent=t('save');const b=m.querySelector('button');b.textContent=t('close');
  const close=()=>{m.remove();document.removeEventListener('keydown',esc,true);};const esc=e=>{if(e.key==='Escape'){e.stopPropagation();close();}};
  b.addEventListener('click',close);m.addEventListener('click',e=>{if(e.target===m)close();});document.addEventListener('keydown',esc,true);document.body.appendChild(m);b.focus();
  if(err)lastErr=String(err&&err.message||err);}
async function copy(k,btn){if(btn){btn.disabled=true;btn.textContent=t('busy');}
  let cvP;try{cvP=compose(capture(k));}catch(e){if(btn){btn.disabled=false;btn.textContent=t('btn');}toast(e.message===t('empty')?t('empty'):t('err')+(e.message||e));return false;}
  let ok=false;
  try{if(!navigator.clipboard||!window.ClipboardItem)throw new Error('ClipboardItem');
    await navigator.clipboard.write([new ClipboardItem({'image/png':cvP.then(toBlob)})]);ok=true;toast(t('ok'));}
  catch(e){try{fallback(await cvP,k,e);}catch(e2){toast(t('err')+(e2.message||e2));}}
  finally{if(btn){btn.disabled=false;btn.textContent=t('btn');}}
  return ok;}
function place(o){const p=o.paikka||{sel:'auto'};const host=p.sel==='auto'?autoHead(o):one(p.sel);if(!host)return null;let b=host.querySelector(':scope > .skv-btn[data-skv="'+o.id+'"]')||document.querySelector('.skv-btn[data-skv="'+o.id+'"]');
  if(b)return b;b=document.createElement('button');b.type='button';b.className='skv-btn';b.dataset.skv=o.id;
  if(p.tapa==='kulma'){if(getComputedStyle(host).position==='static')host.style.position='relative';b.classList.add('skv-kulma');host.appendChild(b);}
  else if(p.tapa==='lisaa'){b.classList.add('skv-lisaa');host.appendChild(b);}
  else{const par=host.parentElement;if(par.classList.contains('chead')||par.classList.contains('skv-head'))par.appendChild(b);
    else{const w=document.createElement('div');w.className='skv-head';par.insertBefore(w,host);w.appendChild(host);w.appendChild(b);}}
  b.addEventListener('click',()=>copy(o.id,b));return b;}
function relabel(){document.querySelectorAll('.skv-btn[data-skv]').forEach(b=>{if(!b.disabled&&b.textContent!==t('btn'))b.textContent=t('btn');if(b.title!==t('title')){b.title=t('title');b.setAttribute('aria-label',t('title'));}});}
function placeAll(){for(const o of C.kaaviot)place(o);relabel();}
window.SimKuva={
  init(cfg){C=cfg;css();placeAll();
    new MutationObserver(()=>relabel()).observe(document.documentElement,{attributes:true,attributeFilter:['lang']});
    document.addEventListener('click',e=>{if(e.target.closest&&e.target.closest('[data-lang]'))setTimeout(relabel,0);});
    let q=0;new MutationObserver(()=>{if(q)return;q=requestAnimationFrame(()=>{q=0;for(const o of C.kaaviot){if(!document.querySelector('.skv-btn[data-skv="'+o.id+'"]'))place(o);}relabel();});})
      .observe(document.body,{childList:true,subtree:true});},
  render,copy,ids:()=>C?C.kaaviot.map(o=>o.id):[],lastError:()=>lastErr};
})();
